<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/icon.jpg" type="image/x-icon">
    <link rel="shortcut icon" href="/static/icon.jpg" type="image/x-icon">
    <title>光明城市自动化控制台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, transparent 60%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 480px;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center; /* 让图标和标题居中 */
        }

        /* ========== 新增：图标样式 ========== */
        .app-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            transition: transform 0.3s ease;
        }
        .app-icon:hover {
            transform: scale(1.05) rotate(2deg); /* 鼠标悬停时轻微放大并倾斜，增加卡通趣味 */
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .form-card h2 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        .form-group { margin-bottom: 18px; text-align: left; } /* 恢复输入框左对齐 */
        .form-group label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 15px;
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }

        .checkbox-group { margin-top: 24px; margin-bottom: 24px; }
        .section-title {
            font-size: 12px;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
        }
        .checkbox-item:hover { background-color: rgba(255, 255, 255, 0.05); }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .checkbox-item span {
            font-size: 15px;
            color: #e2e8f0;
            user-select: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .submit-btn:hover { 
            background: linear-gradient(90deg, #1d4ed8, #2563eb); 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .submit-btn:active { transform: scale(0.98); }

        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        .modal-box {
            padding: 32px 40px;
            border-radius: 12px;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        .modal-icon { font-size: 48px; margin-bottom: 16px; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .modal-msg { font-size: 14px; margin-bottom: 24px; }
        .modal-close-btn {
            padding: 10px 32px;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .success-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }
        .success-box .modal-title { color: #ffffff; }
        .success-box .modal-msg { color: #94a3b8; }
        .success-box .modal-close-btn { background: #3b82f6; }
        .success-box .modal-close-btn:hover { background: #2563eb; }

        .error-box {
            background: rgba(40, 15, 15, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }
        .error-box .modal-title { color: #fca5a5; }
        .error-box .modal-msg { color: #f87171; }
        .error-box .modal-close-btn { background: #ef4444; }
        .error-box .modal-close-btn:hover { background: #dc2626; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="form-card">
    <!-- 新增：伐木工人图标 -->
    <div class="app-icon">
        <img src="/static/icon.png" alt="伐木工人"> <!-- 确保图片命名为 icon.png 并放在同级目录 -->
    </div>
    
    <h2>光明城市控制台</h2>
    
    <form action="/config" method="post">
        <div class="form-group">
            <label for="refresh_time">全局刷新频率 (秒)</label>
            <input type="number" step="0.1" id="refresh_time" name="refresh_time" value="{{ refresh_time }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="adb_ip">ADB IP 地址</label>
                <input type="text" id="adb_ip" name="adb_ip" value="{{ adb_ip }}" required>
            </div>
            <div class="form-group">
                <label for="adb_port">ADB 端口</label>
                <input type="number" id="adb_port" name="adb_port" value="{{ adb_port }}" required>
            </div>
        </div>

        <div class="checkbox-group">
            <div class="section-title">自动化功能模块</div>
            <label class="checkbox-item">
                <input type="checkbox" name="network_adb" {% if network_adb %}checked{% endif %}>
                <span>网络 ADB 连接</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="only_treasure_chest" {% if only_treasure_chest %}checked{% endif %}>
                <span>只获取宝箱</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="jump_paint" {% if jump_paint %}checked{% endif %}>
                <span>跳过油漆桶</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="jump_nail_board" {% if jump_nail_board %}checked{% endif %}>
                <span>跳过钉板</span>
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="close_service" {% if close_service %}checked{% endif %}>
                <span>关闭服务</span>
            </label>
        </div>

        <button type="submit" class="submit-btn">保存并应用配置</button>
    </form>
</div>

<!-- 成功提示弹窗 -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box success-box">
        <div class="modal-icon">✅</div>
        <div class="modal-title">配置保存成功！</div>
        <div class="modal-msg">自动化参数已更新，系统正在应用新配置...</div>
        <button class="modal-close-btn" onclick="closeModal()">确 认</button>
    </div>
</div>

<!-- 失败警告弹窗 -->
<div class="modal-overlay" id="errorModal">
    <div class="modal-box error-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">配置保存失败！</div>
        <div class="modal-msg">系统发生未知错误，请检查参数或稍后重试。</div>
        <button class="modal-close-btn" onclick="closeModal()">我知道了</button>
    </div>
</div>

<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.get('success') === '1') {
            document.getElementById('successModal').style.display = 'flex';
        } else if (urlParams.get('error') === '1') {
            document.getElementById('errorModal').style.display = 'flex';
        }
        
        if (urlParams.has('success') || urlParams.has('error')) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    };

    function closeModal() {
        document.getElementById('successModal').style.display = 'none';
        document.getElementById('errorModal').style.display = 'none';
    }
</script>

</body>
</html>
